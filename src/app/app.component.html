<app-navbar [isMenuExpanded]="isMenuExpanded" (moduleSelected)="onFeaturesReceived($event)"></app-navbar>

<div class="flex">
    <app-sidnav (menuToggled)="isMenuExpanded = $event" [featureSelected]="features"></app-sidnav>
    <div class="flex-1 p-10 mt-16 ml-64 transition-all duration-300 overflow-y-auto" [class.ml-64]="isMenuExpanded"
        [class.ml-16]="!isMenuExpanded">
        <router-outlet></router-outlet>
    </div>
</div>
